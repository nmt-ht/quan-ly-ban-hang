# Render Blueprint: one free web service that builds the Angular app and serves it from the NestJS
# API (same origin). PostgreSQL lives on Neon (free); paste its connection string as DATABASE_URL.
# Each start runs `prisma migrate deploy`, then seeds once if the database is empty (prisma/bootstrap.ts).
services:
  - type: web
    name: ninh-trang-erp
    runtime: node
    plan: free
    region: singapore
    branch: master
    autoDeploy: true
    buildCommand: >-
      cd frontend && npm ci && npm run build &&
      cd ../backend && npm ci && npx prisma generate && npm run build
    startCommand: cd backend && npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      # Neon › Connection string (direct, not pooled), e.g. postgresql://…neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Password of admin@ninhtrang.local, used only when the database is still empty (≥ 10 characters).
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Load the demo data on the first start; set to "false" for a database meant for real data.
      - key: SEED_DEMO
        value: "true"
      # Password of the demo accounts (quan.ly@, ke.toan@, sale1@, thu.kho@ …ninhtrang.local), ≥ 8 characters.
      - key: DEMO_USER_PASSWORD
        sync: false
      # Nhiều doanh nghiệp (optional, README › Nhiều doanh nghiệp): leave PLATFORM_DATABASE_URL empty to stay single-company.
      # Neon direct connection string to the platform database on the same server, e.g. …neon.tech/platform?sslmode=require
      - key: PLATFORM_DATABASE_URL
        sync: false
      # ≥ 32 random characters; signs the owner's sessions and encrypts each company's connection string. Never change it.
      - key: PLATFORM_SECRET
        generateValue: true
      # The owner's sign-in for /quan-tri-nen-tang (password ≥ 12 characters), plus an authenticator code.
      - key: PLATFORM_OWNER_EMAIL
        sync: false
      - key: PLATFORM_OWNER_PASSWORD
        sync: false
      # Optional error reporting (leave empty to keep it off): Sentry project DSNs for the server and the browser.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_FRONTEND_DSN
        sync: false
