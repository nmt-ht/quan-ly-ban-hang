<div class="shell" [class.collapsed]="collapsed()" [class.menu-open]="menuOpen()">
  <aside class="sidebar" id="app-sidebar">
    <a class="brand" routerLink="/tong-quan" aria-label="Ninh Trang — về trang Tổng quan" title="Về trang Tổng quan" (click)="closeMenu()">
      <span class="brand-mark" aria-hidden="true">NT</span>
      <span class="brand-name" *ngIf="!collapsed()">Ninh Trang</span>
    </a>

    <nav class="nav" aria-label="Điều hướng chính">
      <ng-container *ngFor="let group of navGroups; let i = index">
        <button
          *ngIf="group.label && !collapsed()"
          type="button"
          class="nav-group-toggle"
          [attr.aria-expanded]="isOpen(group)"
          [attr.aria-controls]="'nav-group-' + i"
          (click)="toggleGroup(group)"
        >
          <app-nav-icon class="nav-group-chevron" name="chevron-down" />
          <span class="nav-group-name">{{ group.label }}</span>
        </button>
        <div class="nav-items" [id]="'nav-group-' + i" [class.is-closed]="!isOpen(group)" [attr.inert]="isOpen(group) ? null : ''">
          <div class="nav-items-inner">
            <a
              *ngFor="let link of group.links"
              class="nav-link"
              [routerLink]="link.path"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              [title]="collapsed() ? link.label : ''"
              (click)="closeMenu()"
            >
              <app-nav-icon class="nav-link-icon" [name]="link.icon" />
              <span class="nav-link-label">{{ link.label }}</span>
            </a>
          </div>
        </div>
      </ng-container>
    </nav>

    <button
      class="collapse-toggle"
      type="button"
      (click)="toggleCollapsed()"
      [attr.aria-expanded]="!collapsed()"
      [title]="collapsed() ? 'Mở rộng' : ''"
    >
      <app-nav-icon class="nav-link-icon" [name]="collapsed() ? 'panel-open' : 'panel-close'" />
      <span class="nav-link-label">{{ collapsed() ? 'Mở rộng' : 'Thu gọn' }}</span>
    </button>
  </aside>

  <button class="scrim" type="button" aria-label="Đóng menu" tabindex="-1" (click)="closeMenu()"></button>

  <div class="main">
    <header class="topbar">
      <button
        class="menu-btn btn"
        type="button"
        aria-controls="app-sidebar"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        Menu
      </button>
      <button
        class="search-btn"
        type="button"
        aria-label="Tìm hoặc tạo nhanh"
        aria-keyshortcuts="Control+K"
        (click)="palette.show()"
      >
        <app-nav-icon name="search" />
        <span class="search-text">Tìm hoặc tạo nhanh…</span>
        <kbd class="search-kbd" aria-hidden="true">Ctrl K</kbd>
      </button>
      <div class="topbar-spacer"></div>
      <app-account-menu />
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>

<app-command-palette />
