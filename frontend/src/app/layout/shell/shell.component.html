<div class="shell" [class.collapsed]="collapsed()">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">NT</span>
      <span class="brand-name" *ngIf="!collapsed()">Ninh Trang</span>
    </div>

    <nav class="nav">
      <ng-container *ngFor="let group of navGroups">
        <div class="nav-group-label" *ngIf="group.label && !collapsed()">{{ group.label }}</div>
        <a
          *ngFor="let link of group.links"
          class="nav-link"
          [routerLink]="link.path"
          routerLinkActive="active"
        >
          {{ link.label }}
        </a>
      </ng-container>
    </nav>

    <button class="collapse-toggle" type="button" (click)="toggleCollapsed()">
      {{ collapsed() ? '›' : '‹ Thu gọn' }}
    </button>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-spacer"></div>
      <button class="icon-btn" type="button" (click)="toggleDarkMode()" title="Chuyển giao diện">
        {{ darkMode() ? '☀' : '☾' }}
      </button>
      <div class="user-menu">
        <span class="user-name">{{ user?.name || 'Quản trị hệ thống' }}</span>
        <button class="link-btn" type="button" (click)="logout()">Đăng xuất</button>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
