<div class="page-header">
  <div>
    <h1>Đơn nhập hàng</h1>
    <p class="subtitle">{{ data.purchaseOrders().length }} đơn</p>
  </div>
  <div class="toolbar">
    <button class="btn">Xuất Excel</button>
    <button class="btn btn-primary">+ Lập đơn nhập</button>
  </div>
</div>

<div class="filters-bar">
  <input type="text" placeholder="Tìm mã đơn, nhà cung cấp hoặc hàng hoá trong đơn..." class="filter-search" />
  <select><option>Trạng thái</option></select>
  <select><option>Tất cả nhà cung cấp</option></select>
  <select><option>Chọn kỳ</option></select>
  <select><option>Người lập</option></select>
  <select><option>Giá trị đơn</option></select>
</div>

<app-data-table
  [columns]="columns"
  [rows]="data.purchaseOrders()"
  emptyTitle="Chưa có đơn nhập hàng nào"
  emptyHint="Lập đơn nhập để đặt hàng nhà cung cấp và theo dõi hàng về từng đợt."
/>
