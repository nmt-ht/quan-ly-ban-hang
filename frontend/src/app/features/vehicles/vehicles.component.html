<div class="page-header">
  <div>
    <h1>Danh mục xe</h1>
    <p class="subtitle">{{ data.vehicles().length }} xe</p>
  </div>
  <div class="toolbar">
    <button class="btn btn-primary">+ Thêm xe</button>
  </div>
</div>

<div class="filters-bar">
  <input type="text" placeholder="Tìm theo biển số, mã xe, tên gọi" class="filter-search" />
</div>

<app-data-table [columns]="columns" [rows]="data.vehicles()" emptyTitle="Chưa có xe nào" />
