<div class="page-header">
  <div>
    <h1>Khách hàng</h1>
    <p class="subtitle">{{ data.customers().length }} khách hàng</p>
  </div>
  <div class="toolbar">
    <button class="btn">⭳ Xuất Excel</button>
    <a class="btn btn-primary" routerLink="/khach-hang/them">+ Thêm khách hàng</a>
  </div>
</div>

<div class="filters-bar">
  <input type="text" placeholder="Tìm theo tên, mã, điện thoại, mã số..." style="min-width:280px" />
  <select><option>Loại khách</option></select>
  <select><option>Thẻ</option></select>
  <select><option>Tất cả trạng thái</option></select>
</div>

<app-data-table [columns]="columns" [rows]="data.customers()" emptyTitle="Chưa có khách hàng nào" />
