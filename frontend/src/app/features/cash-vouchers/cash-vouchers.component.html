<div class="page-header">
  <div>
    <h1>Phiếu thu chi</h1>
    <p class="subtitle">{{ data.cashVouchers().length }} phiếu</p>
  </div>
  <div class="toolbar">
    <button class="btn">Xuất Excel</button>
    <button class="btn">Tài khoản tiền</button>
    <button class="btn">Loại thu chi</button>
    <a class="btn btn-primary" routerLink="/thu-chi/lap/thu"><app-nav-icon name="plus" />Phiếu thu</a>
    <a class="btn btn-primary" routerLink="/thu-chi/lap/chi"><app-nav-icon name="plus" />Phiếu chi</a>
  </div>
</div>

@if (notice()) {
  <div class="notice" role="status">
    <span>{{ notice() }}</span>
    <button type="button" class="notice-x" aria-label="Đóng thông báo" (click)="notice.set('')"><app-nav-icon name="x" /></button>
  </div>
}

<div class="filters-bar">
  <input type="text" placeholder="Tìm số phiếu, đối tượng, diễn giải..." class="filter-search" />
  <select><option>Thu và chi</option></select>
  <select><option>Loại thu chi</option></select>
  <select><option>Hình thức</option></select>
  <select><option>Tài khoản</option></select>
  <select><option>Chọn kỳ</option></select>
  <select><option>Người lập</option></select>
</div>

<div class="card" style="margin-bottom:20px">
  <h3 style="margin-top:0">Số dư các đầu tài khoản</h3>
  <div class="stat-grid" style="margin-bottom:0">
    <app-stat-card *ngFor="let acc of data.cashAccounts()" [label]="acc.name" [value]="formatVnd(acc.balance)" />
    <app-stat-card label="Tổng thu" [value]="formatVnd(totalThu())" />
    <app-stat-card label="Tổng chi" [value]="formatVnd(totalChi())" />
  </div>
</div>

<app-data-table [columns]="columns" [rows]="data.cashVouchers()" emptyTitle="Chưa có phiếu thu chi nào" />
