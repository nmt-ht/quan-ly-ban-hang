<div class="page-header">
  <div>
    <h1>Đơn hàng bán</h1>
    <p class="subtitle">{{ data.salesOrders().length }} đơn</p>
  </div>
  <div class="toolbar">
    <button class="btn">Xuất Excel</button>
    <a class="btn btn-primary" routerLink="/don-hang/them">+ Lập đơn hàng</a>
  </div>
</div>

<div class="filters-bar">
  <input type="text" placeholder="Tìm mã đơn, khách hàng, người nhận, mặt hàng..." class="filter-search" />
  <select><option>Trạng thái</option></select>
  <select><option>Thẻ</option></select>
  <select><option>Chọn kỳ</option></select>
  <select><option>Nhân viên bán</option></select>
  <select><option>Người lập</option></select>
  <select><option>Giá trị đơn</option></select>
  <select><option>Mới nhất</option></select>
</div>

<app-data-table
  [columns]="columns"
  [rows]="data.salesOrders()"
  emptyTitle="Chưa có đơn hàng nào"
  emptyHint="Lập đơn để bắt đầu bán hàng. Công nợ phải thu chỉ ghi khi khách thực nhận hàng."
/>
