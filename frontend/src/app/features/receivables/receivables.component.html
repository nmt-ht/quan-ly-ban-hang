<div class="page-header">
  <div>
    <h1>Công nợ phải thu</h1>
    <p class="subtitle">{{ rows().length }} khách hàng</p>
  </div>
  <div class="toolbar">
    <button class="btn">⭳ Xuất Excel</button>
    <a class="btn" routerLink="/cong-no/tuoi-no">Báo cáo tuổi nợ</a>
  </div>
</div>

<div class="filters-bar">
  <input type="text" placeholder="Tìm khách hàng..." style="min-width:260px" />
  <button class="btn">Chỉ đối tác còn nợ</button>
</div>

<div class="stat-grid">
  <app-stat-card label="Tổng phải thu (trang này)" [value]="formatVnd(totalBalance())" [negative]="totalBalance() < 0" />
  <app-stat-card label="Trong đó quá hạn" [value]="formatVnd(totalOverdue())" />
</div>

<app-data-table [columns]="columns" [rows]="rows()" emptyTitle="Không có công nợ phải thu" />
