<div class="page-header">
  <div>
    <h1>Phiếu kho</h1>
    <p class="subtitle">{{ data.warehouseVouchers().length }} phiếu</p>
  </div>
  <div class="toolbar" style="position:relative">
    <button class="btn">Xuất Excel</button>
    <button class="btn btn-primary" (click)="menuOpen.set(!menuOpen())">+ Lập phiếu</button>
    <div class="dropdown-menu" *ngIf="menuOpen()">
      <button *ngFor="let t of voucherTypes" class="dropdown-item" type="button">{{ t.label }}</button>
    </div>
  </div>
</div>

<div class="filters-bar">
  <input type="text" placeholder="Tìm mã phiếu, lý do hoặc hàng hoá trong phiếu..." class="filter-search" />
  <select><option>Loại phiếu</option></select>
  <select><option>Tất cả kho</option></select>
  <select><option>Chọn kỳ</option></select>
  <select><option>Người lập</option></select>
</div>

<app-data-table
  [columns]="columns"
  [rows]="data.warehouseVouchers()"
  emptyTitle="Chưa có phiếu kho nào"
  emptyHint="Lập phiếu nhập, xuất, chuyển kho hoặc kiểm kê để bắt đầu."
/>
