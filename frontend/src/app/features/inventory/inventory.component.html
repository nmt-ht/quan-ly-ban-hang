<div class="page-header">
  <div>
    <h1>Tồn kho</h1>
    <p class="subtitle">{{ rows().length }} mặt hàng · đang ẩn mặt hàng tồn 0</p>
  </div>
  <div class="toolbar">
    <button class="btn">Xuất Excel</button>
  </div>
</div>

<div class="filters-bar">
  <input type="text" placeholder="Tìm theo mã, mã đối chiếu hoặc tên..." class="filter-search" />
  <select><option>Tất cả kho</option></select>
  <button class="btn">Đang tồn âm</button>
  <button class="btn">Dưới tồn tối thiểu</button>
  <button class="btn">Hiện cả tồn 0</button>
</div>

<app-data-table
  [columns]="columns"
  [rows]="rows()"
  emptyTitle="Chưa có tồn kho"
  emptyHint="Tồn kho phát sinh từ phiếu nhập, phiếu kiểm kê. Lập phiếu để bắt đầu."
/>
