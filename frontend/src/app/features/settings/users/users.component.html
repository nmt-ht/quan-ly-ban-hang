<div class="page-header">
  <div>
    <h1>Người dùng</h1>
    <p class="subtitle">{{ data.users().length }} tài khoản</p>
  </div>
  <div class="toolbar">
    <button class="btn btn-primary">+ Thêm người dùng</button>
  </div>
</div>

<div class="filters-bar">
  <input type="text" placeholder="Tìm theo tên hoặc email..." class="filter-search" />
</div>

<app-data-table [columns]="columns" [rows]="data.users()" emptyTitle="Chưa có người dùng nào" />
