<div class="login-screen">
  <form class="login-card" (ngSubmit)="submit()">
    <div class="brand">
      <span class="brand-mark">NT</span>
      <span>Ninh Trang</span>
    </div>
    <p class="subtitle">Đăng nhập để tiếp tục</p>

    <div class="field">
      <label>Email *</label>
      <input type="email" name="email" [(ngModel)]="email" required autocomplete="username" />
    </div>
    <div class="field">
      <label>Mật khẩu *</label>
      <input type="password" name="password" [(ngModel)]="password" required autocomplete="current-password" />
    </div>

    <p class="error" *ngIf="error()">{{ error() }}</p>

    <button class="btn btn-primary" type="submit">Đăng nhập</button>
  </form>
</div>
