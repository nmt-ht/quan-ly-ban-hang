<div class="page-header">
  <div>
    <h1>Danh mục hàng hoá</h1>
    <p class="subtitle">{{ products().length }} mặt hàng</p>
  </div>
  <div class="toolbar">
    <button class="btn">⭳ Xuất Excel</button>
    <button class="btn">⭱ Nhập hàng hoá</button>
    <button class="btn">⭱ Nhập định mức</button>
    <a class="btn btn-primary" routerLink="/hang-hoa/them">+ Thêm hàng hoá</a>
  </div>
</div>

<div class="filters-bar">
  <input type="text" placeholder="Tìm theo mã hệ thống, mã đối chiếu hoặc tên..." [value]="search()" (input)="search.set($any($event.target).value)" style="min-width:280px" />
  <select><option>Tính chất</option></select>
  <select><option>Nhóm hàng</option></select>
  <select><option>Tất cả trạng thái</option></select>
</div>

<app-data-table
  [columns]="columns"
  [rows]="products()"
  emptyTitle="Chưa có mặt hàng nào"
  emptyHint="Thêm mặt hàng đầu tiên hoặc nhập danh mục từ file Excel."
/>
