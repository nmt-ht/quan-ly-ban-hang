<p class="subtitle">Danh mục hàng hoá / Thêm mới</p>
<div class="page-header">
  <h1>Thêm hàng hoá</h1>
</div>

<form [formGroup]="form" (ngSubmit)="save()">
  <div class="card" style="margin-bottom:16px">
    <h3 style="margin-top:0">Thông tin chung</h3>

    <div class="field">
      <label>Tên hàng hoá *</label>
      <input type="text" formControlName="name" placeholder="VD: Khung nhôm 20*30 vàng" />
    </div>

    <div class="form-grid">
      <div class="field">
        <label>Tính chất *</label>
        <select formControlName="type">
          <option value="VAT_TU">Vật tư hàng hoá</option>
          <option value="THANH_PHAM">Thành phẩm</option>
          <option value="DICH_VU">Dịch vụ (không có tồn kho)</option>
        </select>
        <span class="hint">Quyết định tiền tố mã: VT / SP / DV.</span>
      </div>
      <div class="field">
        <label>Đơn vị tính chính *</label>
        <input type="text" formControlName="baseUnit" placeholder="VD: Cái, m, kg, TẤM" />
      </div>

      <div class="field">
        <label>Mã đối chiếu</label>
        <input type="text" formControlName="crossRefCode" placeholder="VD: 0625 vàng khung nhôm 20*30" />
        <span class="hint">Mã cũ bên MISA hoặc cách gọi quen thuộc.</span>
      </div>
      <div class="field">
        <label>Nhóm hàng</label>
        <select formControlName="categoryId">
          <option value="">— Không thuộc nhóm nào —</option>
          <option *ngFor="let c of data.categories()" [value]="c.id">{{ c.name }}</option>
        </select>
      </div>

      <div class="field">
        <label>Kho ngầm định</label>
        <select formControlName="defaultWarehouseId">
          <option value="">— Không đặt —</option>
          <option *ngFor="let w of data.warehouses()" [value]="w.id">{{ w.name }}</option>
        </select>
      </div>
      <div class="field">
        <label>Tồn tối thiểu</label>
        <input type="number" formControlName="minStock" />
        <span class="hint">Dưới ngưỡng này sẽ vào danh sách cảnh báo.</span>
      </div>

      <div class="field">
        <label>Thuế suất GTGT (%)</label>
        <input type="number" formControlName="vatRate" />
      </div>
      <div class="field">
        <label>Bảo hành (tháng)</label>
        <input type="number" formControlName="warrantyMonths" />
      </div>

      <div class="field">
        <label>Nguồn gốc</label>
        <input type="text" formControlName="origin" placeholder="VD: Việt Nam" />
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <h3 style="margin-top:0">Giá bán</h3>
    <p class="subtitle" style="margin-top:-8px">Giá theo đơn vị tính chính. Mức giá tự áp theo loại khách khi lên đơn, vẫn sửa tay được.</p>
    <div class="form-grid">
      <div class="field">
        <label>Giá lẻ</label>
        <input type="number" formControlName="retailPrice" />
      </div>
      <div class="field">
        <label>Giá sỉ</label>
        <input type="number" formControlName="wholesalePrice" />
      </div>
      <div class="field">
        <label>Giá dropship</label>
        <input type="number" formControlName="dropshipPrice" />
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <h3 style="margin-top:0">Ghi chú</h3>
    <div class="form-grid">
      <div class="field">
        <label>Diễn giải khi mua</label>
        <input type="text" formControlName="purchaseNote" />
      </div>
      <div class="field">
        <label>Diễn giải khi bán</label>
        <input type="text" formControlName="saleNote" />
      </div>
    </div>
    <div class="field">
      <label>Mô tả</label>
      <textarea rows="3" formControlName="description"></textarea>
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px">
      <input type="checkbox" formControlName="isSellable" /> Được phép bán
    </label>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-top:6px">
      <input type="checkbox" formControlName="isActive" /> Đang kinh doanh
    </label>
  </div>

  <div class="form-actions">
    <a class="btn" routerLink="/hang-hoa">Huỷ</a>
    <button class="btn btn-primary" type="submit">Thêm hàng hoá</button>
  </div>
</form>
